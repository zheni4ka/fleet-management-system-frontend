<rect width="100%" height="100%" fill="#ffffff"/>
<text x="550" y="26" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="bold">Діаграма діяльності: створення маршруту (RouteService.CreateAsync)</text><circle cx="420" cy="60" r="12" fill="#1f2937"/><line x1="420" y1="72" x2="420" y2="100" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="230" y="100" width="380" height="50" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="420" y="125" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Диспетчер заповнює форму «Додати маршрут»</text><line x1="420" y1="150" x2="420" y2="185" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><polygon points="420,185 570,225 420,265 270,225" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="216.875" text-anchor="middle" dominant-baseline="middle" font-size="13">Модель валідна?</text>
<text x="420" y="233.125" text-anchor="middle" dominant-baseline="middle" font-size="13">(локації різні, відпр. &lt; приб.)</text><line x1="570" y1="225" x2="730" y2="225" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="210" text-anchor="middle" dominant-baseline="middle" font-size="13">ні</text><rect x="730" y="200" width="300" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="880" y="225" text-anchor="middle" dominant-baseline="middle" font-size="13.5">400 ValidationException</text><line x1="420" y1="265" x2="420" y2="300" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="282" text-anchor="start" dominant-baseline="middle" font-size="13">так</text><polygon points="420,300 570,340 420,380 270,340" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="340" text-anchor="middle" dominant-baseline="middle" font-size="13">Авто існує?</text><line x1="570" y1="340" x2="730" y2="340" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="325" text-anchor="middle" dominant-baseline="middle" font-size="13">ні</text><rect x="730" y="315" width="300" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="880" y="340" text-anchor="middle" dominant-baseline="middle" font-size="13.5">404 NotFoundException</text><line x1="420" y1="380" x2="420" y2="415" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="397" text-anchor="start" dominant-baseline="middle" font-size="13">так</text><polygon points="420,415 570,455 420,495 270,455" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="446.875" text-anchor="middle" dominant-baseline="middle" font-size="13">Авто на ТО?</text>
<text x="420" y="463.125" text-anchor="middle" dominant-baseline="middle" font-size="13">(UnderMaintenance)</text><line x1="570" y1="455" x2="730" y2="455" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="440" text-anchor="middle" dominant-baseline="middle" font-size="13">так</text><rect x="730" y="430" width="300" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="880" y="455" text-anchor="middle" dominant-baseline="middle" font-size="13.5">400 «Автомобіль на ремонті»</text><line x1="420" y1="495" x2="420" y2="530" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="512" text-anchor="start" dominant-baseline="middle" font-size="13">ні</text><polygon points="420,530 570,570 420,610 270,570" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="561.875" text-anchor="middle" dominant-baseline="middle" font-size="13">Водій і локації</text>
<text x="420" y="578.125" text-anchor="middle" dominant-baseline="middle" font-size="13">існують?</text><line x1="570" y1="570" x2="730" y2="570" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="555" text-anchor="middle" dominant-baseline="middle" font-size="13">ні</text><rect x="730" y="545" width="300" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="880" y="570" text-anchor="middle" dominant-baseline="middle" font-size="13.5">404 NotFoundException</text><line x1="420" y1="610" x2="420" y2="645" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="627" text-anchor="start" dominant-baseline="middle" font-size="13">так</text><polygon points="420,645 580,690 420,735 260,690" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="673.75" text-anchor="middle" dominant-baseline="middle" font-size="13">Інтервал перетинається</text>
<text x="420" y="690" text-anchor="middle" dominant-baseline="middle" font-size="13">з активним рейсом</text>
<text x="420" y="706.25" text-anchor="middle" dominant-baseline="middle" font-size="13">авто або водія?</text><line x1="580" y1="690" x2="730" y2="690" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="675" text-anchor="middle" dominant-baseline="middle" font-size="13">так</text><rect x="730" y="665" width="300" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="880" y="681.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">400 «Водій / автомобіль</text>
<text x="880" y="698.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">вже зайнятий»</text><line x1="420" y1="735" x2="420" y2="770" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="752" text-anchor="start" dominant-baseline="middle" font-size="13">ні</text><rect x="230" y="770" width="380" height="50" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="420" y="795" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Зберегти маршрут (Routes)</text><line x1="420" y1="820" x2="420" y2="855" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><polygon points="420,855 570,895 420,935 270,895" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="420" y="895" text-anchor="middle" dominant-baseline="middle" font-size="13">Статус = InProgress?</text><line x1="570" y1="895" x2="730" y2="895" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="650" y="880" text-anchor="middle" dominant-baseline="middle" font-size="13">так</text><rect x="730" y="870" width="300" height="50" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="880" y="895" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Auto.Status = InService</text><polyline points="880,920 880,960 420,960" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><line x1="420" y1="935" x2="420" y2="975" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="438" y="950" text-anchor="start" dominant-baseline="middle" font-size="13">ні</text><rect x="230" y="975" width="380" height="50" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="420" y="1000" text-anchor="middle" dominant-baseline="middle" font-size="13.5">SaveChanges + запис RouteCreated у AuditLogs</text><line x1="420" y1="1025" x2="420" y2="1060" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="230" y="1060" width="380" height="50" rx="18" fill="#e7f5ea" stroke="#3c8a4f" stroke-width="1.5"/><text x="420" y="1085" text-anchor="middle" dominant-baseline="middle" font-size="13.5">201 Created → toast «Маршрут додано»</text><line x1="420" y1="1110" x2="420" y2="1140" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><circle cx="420" cy="1156" r="14" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="420" cy="1156" r="8" fill="#1f2937"/>
</svg>