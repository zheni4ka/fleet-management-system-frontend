<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Arial, 'Segoe UI', sans-serif" font-size="15" fill="#1f2937">
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2937" stroke-width="1.5"/></marker>
<marker id="fill" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L15,8 L1,15 z" fill="#fff" stroke="#1f2937" stroke-width="1.5"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="700" y="26" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="bold">Життєвий цикл дефекту (Jira / Trello)</text><rect x="20" y="170" width="180" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="110" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">New</text>
<text x="110" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Новий)</text><rect x="240" y="170" width="180" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="330" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Open / To Do</text>
<text x="330" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Відкритий)</text><line x1="200" y1="200" x2="240" y2="200" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="460" y="170" width="180" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="550" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">In Progress</text>
<text x="550" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Виправляється)</text><line x1="420" y1="200" x2="460" y2="200" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="680" y="170" width="180" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="770" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Resolved</text>
<text x="770" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Виправлено)</text><line x1="640" y1="200" x2="680" y2="200" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="900" y="170" width="180" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="990" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Retest</text>
<text x="990" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Перевірка QA)</text><line x1="860" y1="200" x2="900" y2="200" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="1140" y="170" width="180" height="60" rx="18" fill="#e7f5ea" stroke="#3c8a4f" stroke-width="1.5"/><text x="1230" y="191.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Closed</text>
<text x="1230" y="208.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Закрито)</text><line x1="1080" y1="200" x2="1140" y2="200" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="240" y="370" width="180" height="60" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="330" y="391.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Rejected / Duplicate</text>
<text x="330" y="408.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Відхилено)</text><line x1="330" y1="230" x2="330" y2="370" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="380" y="300" text-anchor="middle" dominant-baseline="middle" font-size="12">не дефект</text><rect x="680" y="370" width="180" height="60" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="770" y="391.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Reopened</text>
<text x="770" y="408.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(Повторно відкрито)</text><polyline points="990,230 990,400 860,400" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="1040" y="322.5" text-anchor="middle" dominant-baseline="middle" font-size="12">не</text>
<text x="1040" y="337.5" text-anchor="middle" dominant-baseline="middle" font-size="12">виправлено</text><polyline points="680,400 550,400 550,230" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="700" y="480" text-anchor="middle" dominant-baseline="middle" font-size="13" font-style="italic">Приклад: D-01 «GET-ендпоінти доступні без токена» — New → Open → In Progress → Resolved → Retest (401 без токена) → Closed</text>
</svg>