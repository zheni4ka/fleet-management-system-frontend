<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="bold">Діаграма діяльності: звіт за період (GetRoutesPeriodReportAsync)</text><circle cx="350" cy="60" r="12" fill="#1f2937"/><line x1="350" y1="72" x2="350" y2="100" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="140" y="100" width="420" height="50" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="350" y="125" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Отримати periodStartDate, periodEndDate</text><line x1="350" y1="150" x2="350" y2="180" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><polygon points="350,180 520,225 350,270 180,225" fill="#fff7d6" stroke="#b59a2a" stroke-width="1.5"/><text x="350" y="216.875" text-anchor="middle" dominant-baseline="middle" font-size="13">Кінець ≥ початку і</text>
<text x="350" y="233.125" text-anchor="middle" dominant-baseline="middle" font-size="13">період ≤ 366 днів?</text><line x1="520" y1="225" x2="630" y2="225" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="575" y="210" text-anchor="middle" dominant-baseline="middle" font-size="13">ні</text><rect x="635" y="200" width="210" height="50" rx="18" fill="#fbe9e9" stroke="#b04040" stroke-width="1.5"/><text x="740" y="225" text-anchor="middle" dominant-baseline="middle" font-size="13.5">400 ValidationException</text><line x1="350" y1="270" x2="350" y2="305" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><text x="368" y="287" text-anchor="start" dominant-baseline="middle" font-size="13">так</text><rect x="90" y="310" width="520" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="350" y="331.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">SELECT рейси: start 00:00 ≤ DepartureTime &lt; (end + 1 день) 00:00</text>
<text x="350" y="348.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(специфікація RouteSpecs.ByDeparturePeriod)</text><line x1="350" y1="370" x2="350" y2="405" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="90" y="408" width="520" height="6" fill="#1f2937"/><line x1="170" y1="414" x2="170" y2="450" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="87.5" y="453" width="165" height="64" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="170" y="476.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Кількість рейсів</text>
<text x="170" y="493.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">за статусами</text><line x1="170" y1="517" x2="170" y2="556" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><line x1="350" y1="414" x2="350" y2="450" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="267.5" y="453" width="165" height="64" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="350" y="476.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Години в дорозі</text>
<text x="350" y="493.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">(завершені, ±0,1)</text><line x1="350" y1="517" x2="350" y2="556" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><line x1="530" y1="414" x2="530" y2="450" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="447.5" y="453" width="165" height="64" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="530" y="476.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Кількість різних</text>
<text x="530" y="493.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">авто й водіїв</text><line x1="530" y1="517" x2="530" y2="556" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="90" y="556" width="520" height="6" fill="#1f2937"/><line x1="350" y1="562" x2="350" y2="600" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="90" y="605" width="520" height="60" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="350" y="626.5625" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Згрупувати рейси за водієм: кількість, виконані, години;</text>
<text x="350" y="643.4375" text-anchor="middle" dominant-baseline="middle" font-size="13.5">відсортувати за кількістю рейсів ↓</text><line x1="350" y1="665" x2="350" y2="700" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="90" y="705" width="520" height="50" rx="18" fill="#e7f5ea" stroke="#3c8a4f" stroke-width="1.5"/><text x="350" y="730" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Повернути показники + список рейсів (RouteDTO)</text><line x1="350" y1="755" x2="350" y2="790" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><rect x="90" y="793" width="520" height="44" rx="18" fill="#eef3fb" stroke="#3f5f8f" stroke-width="1.5"/><text x="350" y="815" text-anchor="middle" dominant-baseline="middle" font-size="13.5">Сторінка /report показує картки, таблиці, «Друк»</text><line x1="350" y1="837" x2="350" y2="860" stroke="#1f2937" stroke-width="1.4" marker-end="url(#fill)"/><circle cx="350" cy="875" r="14" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="350" cy="875" r="8" fill="#1f2937"/>
