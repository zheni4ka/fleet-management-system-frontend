<rect width="100%" height="100%" fill="#ffffff"/>
<text x="700" y="26" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="bold">Календарний план розробки (діаграма Ганта), 2026 р.</text><line x1="380" y1="60" x2="380" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="429" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Бер</text><line x1="478" y1="60" x2="478" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="527" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Кві</text><line x1="576" y1="60" x2="576" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="625" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Тра</text><line x1="674" y1="60" x2="674" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="723" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Чер</text><line x1="772" y1="60" x2="772" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="821" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Лип</text><line x1="870" y1="60" x2="870" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="919" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Сер</text><line x1="968" y1="60" x2="968" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="1017" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Вер</text><line x1="1066" y1="60" x2="1066" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="1115" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Жов</text><line x1="1164" y1="60" x2="1164" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="1213" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Лис</text><line x1="1262" y1="60" x2="1262" y2="520" stroke="#e5e7eb" stroke-width="1.4"/><text x="1311" y="75" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold">Гру</text><text x="20" y="113" text-anchor="start" dominant-baseline="middle" font-size="13.5">1. Аналіз предметної області, команда</text><rect x="380" y="100" width="58.8" height="26" rx="5" fill="#6b7280" opacity="0.85"/><text x="20" y="154" text-anchor="start" dominant-baseline="middle" font-size="13.5">2. Технічне завдання й документація</text><rect x="409.4" y="141" width="88.19999999999999" height="26" rx="5" fill="#b59a2a" opacity="0.85"/><text x="20" y="195" text-anchor="start" dominant-baseline="middle" font-size="13.5">3. Проєктування БД і архітектури</text><rect x="409.4" y="182" width="68.6" height="26" rx="5" fill="#7a5aa6" opacity="0.85"/><text x="20" y="236" text-anchor="start" dominant-baseline="middle" font-size="13.5">4. Бекенд: сутності, CRUD, JWT</text><rect x="429" y="223" width="205.8" height="26" rx="5" fill="#3c8a4f" opacity="0.85"/><text x="20" y="277" text-anchor="start" dominant-baseline="middle" font-size="13.5">5. Фронтенд: форми й таблиці</text><rect x="634.8" y="264" width="78.39999999999998" height="26" rx="5" fill="#3f5f8f" opacity="0.85"/><text x="20" y="318" text-anchor="start" dominant-baseline="middle" font-size="13.5">6. Маршрути, ТО, журнал дій</text><rect x="576" y="305" width="490" height="26" rx="5" fill="#3c8a4f" opacity="0.85"/><text x="20" y="359" text-anchor="start" dominant-baseline="middle" font-size="13.5">7. Пошук і звіти за період</text><rect x="1017" y="346" width="156.79999999999995" height="26" rx="5" fill="#3f5f8f" opacity="0.85"/><text x="20" y="400" text-anchor="start" dominant-baseline="middle" font-size="13.5">8. Тестування й виправлення дефектів</text><rect x="1066" y="387" width="137.20000000000005" height="26" rx="5" fill="#b04040" opacity="0.85"/><text x="20" y="441" text-anchor="start" dominant-baseline="middle" font-size="13.5">9. Ліцензія, оцінка COCOMO, надійність</text><rect x="1183.6" y="428" width="39.20000000000003" height="26" rx="5" fill="#b59a2a" opacity="0.85"/><text x="20" y="482" text-anchor="start" dominant-baseline="middle" font-size="13.5">10. Впровадження (реліз 1.0)</text><rect x="1213" y="469" width="78.40000000000006" height="26" rx="5" fill="#1f2937" opacity="0.85"/><line x1="1203.2" y1="85" x2="1203.2" y2="520" stroke="#b04040" stroke-width="2" stroke-dasharray="7 5"/><text x="1209.2" y="535" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#b04040">сьогодні 13.11</text>
